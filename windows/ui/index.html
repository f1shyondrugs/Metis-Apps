<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'">
<title>Metis AI</title>
<link rel="stylesheet" href="styles.css">
<script defer src="renderer.js"></script>
</head>
<body>
<main>
  <img class="logo" src="../assets/icon.png" width="56" height="56" alt="">
  <p class="brand">Metis AI</p>
  <h1 id="heading">Opening Metis.</h1>
  <p id="description" aria-live="polite">Connecting to the server.</p>
  <p id="server-label"></p>
  <form id="form" hidden>
    <label for="server">Server address</label>
    <input id="server" name="server" type="url" required autocomplete="url" spellcheck="false" placeholder="https://ai.f1shy312.com">
    <p id="validation" role="alert"></p>
    <button type="submit">Open Metis</button>
  </form>
  <div id="actions" hidden>
    <button id="retry">Try again</button>
    <button id="settings" class="secondary">Change server</button>
  </div>
  <footer>Your Metis. In its own window.</footer>
</main>
</body>
</html>
