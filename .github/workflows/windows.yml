name: Metis desktop releases

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            command: build:win
          - os: macos-latest
            platform: macos
            command: build:mac
          - os: ubuntu-24.04
            platform: linux
            command: build:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Confirm release tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(node -p "require('./desktop/package.json').version")" = "${{ github.ref_name }}"
      # Native dependencies include Node-API prebuilds. Electron tests below load
      # the shipped bindings and start the Linux hook in the isolated Xvfb display.
      - name: Install dependencies
        run: npm ci --prefix desktop
      - name: Generate icons from the canonical Metis M
        run: npm run generate:icons --prefix desktop
      - name: Test desktop and device modules
        run: npm run check --prefix desktop && npm test --prefix desktop
      - name: Configure Electron sandbox on Linux CI
        if: matrix.platform == 'linux'
        run: sudo chown root:root desktop/node_modules/electron/dist/chrome-sandbox && sudo chmod 4755 desktop/node_modules/electron/dist/chrome-sandbox
      - name: Electron integration tests
        shell: bash
        run: |
          if [ '${{ matrix.platform }}' = linux ]; then xvfb-run -a npm run test:e2e --prefix desktop; else npm run test:e2e --prefix desktop; fi
      - name: Build desktop installer
        run: npm run ${{ matrix.command }} --prefix desktop -- --publish never
      - name: Verify packaged Linux native modules
        if: matrix.platform == 'linux'
        env:
          METIS_NATIVE_TEST_ARCHIVE: ${{ github.workspace }}/desktop/dist/linux-unpacked/resources/app.asar
        run: xvfb-run -a desktop/node_modules/.bin/electron desktop/tests/native-modules.cjs
      - name: Verify Windows install, background operation and uninstall
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./desktop/tests/installer-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: metis-desktop-${{ matrix.platform }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.yml
            desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 7
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: metis-desktop-*
          path: release
          merge-multiple: true
      - name: Publish complete release after every platform succeeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/* --title "Metis ${{ github.ref_name }}" --generate-notes --verify-tag --latest
