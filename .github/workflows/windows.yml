name: Windows desktop
on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows.yml']
    tags: ['desktop-v*']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build:win
      - run: ./tests/installer-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Metis-AI-Windows
          path: |
            windows/dist/*.exe
            windows/dist/*.blockmap
            windows/test-results/*.png
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Metis-AI-Windows
          path: artifacts
      - name: Publish desktop prototype
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/dist/*.exe artifacts/dist/*.blockmap --title "Metis AI Desktop ${RELEASE_TAG#desktop-v}" --prerelease --notes "Windows desktop prototype rendering the Metis website. Includes Start menu and desktop shortcuts and a Windows Apps uninstall entry. Unsigned prototype installer."
